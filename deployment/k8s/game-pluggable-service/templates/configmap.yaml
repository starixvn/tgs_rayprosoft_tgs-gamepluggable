apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-pluggable-service.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Pluggable": {
        "GameProvidersBaseUrl": "http://game-gameproviders",
        "CashServiceBaseUrl": "http://cashservice-api",
        "GameProviderKickPlayerServerBaseUrl": "http://game-kickplayer-server",
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver",
        "GameVerificationBaseUrl": "http://game-gameverification:9090",
        "GameFundTransferBaseUrl": "http://game-gamefundtransfer:9090"
      }
    }
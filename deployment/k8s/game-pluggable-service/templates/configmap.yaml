apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-pluggable-service.fullname" . }}
  labels:
    {{- include "game-pluggable-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Tgs.GamePluggable.Core.Backoffice.ApplicationServices.GameRoundAddCommandService": "Information",
          "Tgs.GamePluggable.Core.Backoffice.ApplicationServices.GameRoundClosedCommandService": "Information",
          "Tgs.GamePluggable.Core.Backoffice.ApplicationServices.GameRoundResettleCommandService": "Information"
        }
      },
      "GamePluggableConnectionStrings": {
        "GameProvidersClientBaseUrl": "http://game-gameproviders/",
        "GamePlayerLogOutClientBaseUrl": "http://game-gameplayerlogout/",
        "GameFundTransferClientBaseUrl": "http://game-gamefundtransfer/",
        "CashServiceClientBaseUrl": "http://cashservice-api/",
        "GameBetsClientBaseUrl": "http://game-gamebets/",
        "GameBetsRapidTestWorkerClientBaseUrl": "http://game-gamebets-rapidtest-worker/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
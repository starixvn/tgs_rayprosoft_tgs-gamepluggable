apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-pluggable-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning"
        }
      },
      "Pluggable": {
        "GameProvidersClientBaseUrl": "http://game-gameproviders/",
        "CashServiceClientBaseUrl": "http://cashservice-api/",
        "GamePlayerLogOutClientBaseUrl": "http://game-gameplayerlogout:9090/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameFundTransferClientBaseUrl": "dns:///game-gamefundtransfer:9090/",
        "GameCurrencyClientBaseUrl": "http://game-gamecurrency/",
        "GameRoundsClientBaseUrl": "http://game-gamerounds"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
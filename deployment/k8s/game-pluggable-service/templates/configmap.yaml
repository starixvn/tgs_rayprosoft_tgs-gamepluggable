apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-pluggable-service.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        },
        "Console": {
          "FormatterName": "Simple"
        }
      },
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "NatsMQ": "{{ .Values.nats.urls }}",
        "TGSGameProviders": "http://game-gameproviders",
        "CashService": "http://cashservice-api",
        "TGSGameProviderKickPlayerServer": "http://game-kickplayer-server"
      },
      "ForwardedHeaders": {
        "ForwardLimit": 2,
        "KnownProxies": [
          "192.168.50.1",
          "220.132.206.70",
          "211.24.72.160",
          "18.167.169.96"
        ]
      },
      "AllowedHosts": "*"
    }
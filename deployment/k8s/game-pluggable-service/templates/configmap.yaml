apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-pluggable-service.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "NatsMQ": "{{ .Values.nats.urls }}",
        "TGSGameProviders": "http://game-gameproviders",
        "CashService": "http://cashservice-api",
        "TGSGameProviderKickPlayerServer": "http://game-kickplayer-server"
      },
      "AllowedHosts": "*"
    }
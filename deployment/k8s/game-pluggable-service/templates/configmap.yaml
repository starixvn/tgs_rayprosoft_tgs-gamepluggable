apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-pluggable-service.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Pluggable": {
        "GameProvidersClientBaseUrl": "http://game-gameproviders/",
        "CashServiceClientBaseUrl": "http://cashservice-api/",
        "KickPlayerServiceClientBaseUrl": "http://game-kickplayer-server/",
        "GameProvidersQueryServerClientBaseUrl": "http://game-gameprovider-queryserver/",
        "GameVerificationClientBaseUrl": "http://game-gameverification:9090/",
        "GameFundTransferClientBaseUrl": "http://game-gamefundtransfer:9090/",
        "GameCurrencyClientBaseUrl": "http://game-gamecurrency/"
      }
    }